<title>Trellis 重设计稿 · 03 手机端</title>
<script>
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var t = q || localStorage.getItem("trellis-mock-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    if (t === "dark") document.documentElement.classList.add("dark");
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────────────
   Trellis UI 重设计 · 克制工具风 · 设计 token（2026-09-28 静态稿）

   用法：本文件是三份静态稿的唯一色值来源（构建时内联进各 HTML）。
   变量名 = app/globals.css 的现有语义名，**只改取值不改名**；
   标「新增」的是 globals.css 目前没有、落地时需要补进 :root / .dark
   和 @theme inline 的变量。

   原则
   - 中性色承担 95% 的界面；强调色（低饱和蓝紫）只给主按钮 / 选中 / 焦点环。
   - 状态色（positive / warn / danger）只做 6px 圆点与 1px 细描边，不做大面积填充。
   - 六个语义拆开撞色（旧版：未读=成功、分叉=警告、Project=危险）：
       unread   蓝紫偏亮（与强调同族——「等你处理」的提示）   h≈268
       positive 绿                                              h≈155
       fork     兰紫 / 洋红（不再用琥珀）                       h≈330
       warn     琥珀                                            h≈70
       mode-project 低饱和青（不再用红族）                      h≈195
       danger   红                                              h≈25
   - 卡片无阴影，1px ≈10% 描边；只有浮层（下拉、弹窗、树浮窗）用极轻阴影。
   ───────────────────────────────────────────────────────────────────── */

:root {
  color-scheme: light;

  /* ── 字体（新增；globals.css 目前走 Tailwind 默认 font-sans） ── */
  --font-sans: "Geist", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
    system-ui, -apple-system, sans-serif;
  --font-mono: "Geist Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;

  /* ── 字号（对应 @theme 的 --text-*，整体上调到 13–14px 控件基线） ── */
  --text-nano: 11px;    /* ← --text-nano（原 10px）：kbd / 角标 */
  --text-label: 12px;   /* ← --text-label（原 11px）：meta / 时间 / 计数 */
  --text-ui: 13px;      /* ← --text-ui（原 12.5px）：控件默认 */
  --text-body: 14px;    /* ← --text-body：画布正文 / 输入框 */
  --text-reading: 15px; /* ← --text-reading：线性正文 */
  --text-title: 17px;   /* ← --text-title（原 18px） */

  /* ── 圆角（对应 @theme 的 --radius-*，整体收紧一档） ── */
  --radius-field: 6px;   /* ← --radius-field（原 8px）：按钮 / 输入 / chip = rounded-md */
  --radius-card: 8px;    /* ← --radius-card（原 12px）：卡片 / 代码块 */
  --radius-overlay: 10px;/* ← --radius-overlay（原 16px）：下拉 / 弹窗 / 浮窗 */

  /* ── 尺寸（新增） ── */
  --control-h: 32px;     /* 新增：所有桌面控件统一 h-8 */
  --control-h-sm: 26px;  /* 新增：表格行内的次级小按钮 */
  --touch-min: 44px;     /* 新增：手机热区下限（mobile-verify 依赖 44px） */

  /* ── 表面 ── */
  --surface-canvas: #fafafa;           /* ← --surface-canvas（原 stone-50） */
  --surface: #ffffff;                  /* ← --surface */
  --surface-raised: #ffffff;           /* ← --surface-raised：浮层底 */
  --surface-muted: #f3f3f4;            /* ← --surface-muted：用户消息块 / 分段器底 */
  --surface-hover: rgba(0, 0, 0, 0.04);/* 新增：行 hover，替代各处 hover:bg-stone-100 */
  --scrim: rgba(9, 9, 11, 0.36);       /* ← --scrim（原配 /50 用，这里直接给成品值） */

  /* ── 描边（改成半透明，深浅皮肤都是「约 10%」） ── */
  --line: rgba(0, 0, 0, 0.09);         /* ← --line：卡片 / 分隔线 */
  --line-strong: rgba(0, 0, 0, 0.16);  /* ← --line-strong：输入框 / 描边按钮 */
  --line-faint: rgba(0, 0, 0, 0.05);   /* ← --line-faint：表格行内分隔 */

  /* ── 文字：近黑 + 两档灰 ── */
  --ink: #1b1b1f;                      /* ← --ink */
  --ink-strong: #0b0b0d;               /* ← --ink-strong：标题 */
  --ink-muted: #56565f;                /* ← --ink-muted：灰一档（7.1:1 on #fafafa） */
  --ink-faint: #74747e;                /* ← --ink-faint：灰二档（4.6:1 on #fafafa，满足 AA） */
  --ink-inverse: #ffffff;              /* ← --ink-inverse */

  /* ── 强调：唯一的低饱和蓝紫（旧 indigo-600 chroma 0.262 → 0.12） ── */
  --accent: oklch(52% 0.12 277);       /* ← --accent：主按钮底 / 选中指示 */
  --accent-strong: oklch(46% 0.12 277);/* ← --accent-strong：主按钮 hover */
  --accent-ink: oklch(42% 0.1 277);    /* ← --accent-ink：淡底上的强调文字 */
  --accent-muted: oklch(96.5% 0.014 277);/* ← --accent-muted：选中行底 */
  --accent-line: oklch(84% 0.045 277); /* ← --accent-line：选中描边 */
  --accent-fg: #ffffff;                /* 新增：主按钮上的文字（深色皮肤不必是 ink-inverse） */
  --focus-ring: oklch(52% 0.12 277 / 0.35); /* 新增：统一焦点环（2px） */

  /* ── 状态色：只做圆点与细描边 ── */
  --warn: oklch(72% 0.14 70);          /* ← --warn */
  --warn-ink: oklch(45% 0.09 60);      /* ← --warn-ink */
  --warn-muted: oklch(97.5% 0.02 80);  /* ← --warn-muted */
  --warn-line: oklch(85% 0.08 75);     /* ← --warn-line */
  --danger: oklch(58% 0.18 25);        /* ← --danger */
  --danger-strong: oklch(52% 0.18 25); /* ← --danger-strong */
  --danger-ink: oklch(46% 0.14 25);    /* ← --danger-ink */
  --danger-muted: oklch(97% 0.012 25); /* ← --danger-muted */
  --danger-line: oklch(86% 0.05 25);   /* ← --danger-line */
  --positive: oklch(62% 0.13 155);     /* ← --positive */
  --positive-ink: oklch(42% 0.08 155); /* ← --positive-ink */
  --positive-muted: oklch(97.5% 0.015 155); /* ← --positive-muted */
  --positive-line: oklch(85% 0.06 155);/* ← --positive-line */

  /* ── 未读：与「成功」拆开，改用强调同族的亮蓝紫 ── */
  --unread: oklch(60% 0.13 268);       /* ← --unread（原 emerald，与 positive 撞） */
  --unread-ink: oklch(44% 0.1 268);    /* ← --unread-ink */
  --unread-muted: oklch(96.5% 0.016 268); /* ← --unread-muted */
  --unread-line: oklch(84% 0.05 268);  /* ← --unread-line */

  /* ── 分叉：与「警告」拆开，改兰紫 ── */
  --fork: oklch(58% 0.11 330);         /* ← --fork（原 amber，与 warn 撞） */
  --fork-ink: oklch(44% 0.09 330);     /* ← --fork-ink */
  --fork-muted: oklch(96.5% 0.02 330); /* ← --fork-muted */
  --fork-line: oklch(84% 0.06 330);    /* ← --fork-line */

  /* ── 模式：Chat 中性灰；Project 改低饱和青（原 rose，与 danger 撞） ── */
  --mode-chat: #9a9aa3;                /* ← --mode-chat */
  --mode-chat-ink: #3f3f46;            /* ← --mode-chat-ink */
  --mode-chat-muted: #f3f3f4;          /* ← --mode-chat-muted */
  --mode-chat-line: rgba(0, 0, 0, 0.12);       /* ← --mode-chat-line */
  --mode-chat-line-strong: rgba(0, 0, 0, 0.24);/* ← --mode-chat-line-strong */
  --mode-project: oklch(60% 0.08 195);         /* ← --mode-project */
  --mode-project-ink: oklch(42% 0.06 195);     /* ← --mode-project-ink */
  --mode-project-muted: oklch(97% 0.012 195);  /* ← --mode-project-muted */
  --mode-project-line: oklch(85% 0.04 195);    /* ← --mode-project-line */
  --mode-project-line-strong: oklch(70% 0.07 195); /* ← --mode-project-line-strong */

  /* ── 画布 ── */
  --accent-vivid: oklch(56% 0.13 277); /* ← --accent-vivid */
  --edge: oklch(84% 0.02 277);         /* ← --edge：连线降到近中性 */
  --edge-active: oklch(56% 0.12 277);  /* ← --edge-active */

  /* ── 代码：浅色皮肤下代码块也浅（旧「代码块恒暗」待用户确认是否保留） ── */
  --code-bg: #f6f6f7;                  /* ← --code-bg */
  --code-ink: #1b1b1f;                 /* ← --code-ink */
  --code-bar-bg: #f6f6f7;              /* ← --code-bar-bg：与正文同底，靠分隔线区分 */
  --code-bar-line: rgba(0, 0, 0, 0.07);/* ← --code-bar-line */
  --code-inline-ink: #1b1b1f;          /* ← --code-inline-ink（原 pink-700，去掉） */
  --code-inline-bg: rgba(0, 0, 0, 0.05); /* 新增：行内 code 灰底 */
  --code-comment: #8b8b94;             /* 新增：唯一的语法着色——注释降灰 */
  --code-add-bg: oklch(62% 0.13 155 / 0.08); /* 新增：diff 新增行底 */
  --code-del-bg: oklch(58% 0.18 25 / 0.07);  /* 新增：diff 删除行底 */

  /* ── 正文划选标记 ── */
  --mark-fork-bg: oklch(58% 0.11 330 / 0.12);   /* ← --mark-fork-bg */
  --mark-fork-line: oklch(58% 0.11 330 / 0.55); /* ← --mark-fork-line（下划线） */
  --mark-fork-hover-bg: oklch(58% 0.11 330 / 0.2); /* ← --mark-fork-hover-bg */
  --mark-fork-ink: inherit;                     /* ← --mark-fork-ink */
  --mark-fork-pulse-bg: oklch(58% 0.11 330 / 0.3);   /* ← --mark-fork-pulse-bg */
  --mark-fork-pulse-ring: oklch(58% 0.11 330 / 0.5); /* ← --mark-fork-pulse-ring */
  --mark-note-bg: oklch(62% 0.13 155 / 0.1);    /* ← --mark-note-bg */
  --mark-note-line: oklch(62% 0.13 155 / 0.5);  /* ← --mark-note-line */
  --mark-note-ink: inherit;                     /* ← --mark-note-ink */
  --mark-note-pulse-bg: oklch(62% 0.13 155 / 0.25);  /* ← --mark-note-pulse-bg */
  --mark-note-pulse-ring: oklch(62% 0.13 155 / 0.5); /* ← --mark-note-pulse-ring */

  /* ── 层级（新增）：只有浮层有阴影 ── */
  --shadow-overlay: 0 0 0 1px rgba(0, 0, 0, 0.06), 0 8px 24px -8px rgba(0, 0, 0, 0.14);
  --shadow-float: 0 0 0 1px rgba(0, 0, 0, 0.06), 0 4px 14px -6px rgba(0, 0, 0, 0.12);
  --z-float: 20;   /* 新增：TreePanel 浮窗 */
  --z-popover: 50; /* 新增：下拉 / 菜单（必须高于 TreePanel，修 d-14 遮挡） */
  --z-modal: 60;   /* 新增：⌘K / 弹窗 */

  /* ── 动效（新增）：弹层 100ms 淡入 + 0.97 缩放 ── */
  --dur-fast: 100ms;
  --dur-base: 160ms;
  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
}

.dark {

  --surface-canvas: #0b0b0c;           /* ← --surface-canvas（原 stone-950） */

  --accent-muted: oklch(25% 0.035 277);/* ← --accent-muted */

  --positive-ink: oklch(85% 0.08 155); /* ← --positive-ink */
  --positive-muted: oklch(24% 0.03 155); /* ← --positive-muted */
  --positive-line: oklch(44% 0.07 155);/* ← --positive-line */

  --unread: oklch(70% 0.12 268);       /* ← --unread */
  --unread-ink: oklch(84% 0.07 268);   /* ← --unread-ink */
  --unread-muted: oklch(25% 0.035 268);/* ← --unread-muted */
  --unread-line: oklch(44% 0.07 268);  /* ← --unread-line */

  --fork: oklch(70% 0.11 330);         /* ← --fork */
  --fork-ink: oklch(84% 0.07 330);     /* ← --fork-ink */
  --fork-muted: oklch(25% 0.035 330);  /* ← --fork-muted */
  --fork-line: oklch(44% 0.07 330);    /* ← --fork-line */

/* ── 共享原语（落地时对应 shadcn/Radix 组件：Button / Input / Tabs / Tooltip / DropdownMenu / Dialog / Badge / Skeleton） ── */
*,
*::before,
*::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  font-size: var(--text-ui);
  line-height: 1.5;
  color: var(--ink);
  background: var(--surface-canvas);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "liga", "calt";
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
.mono { font-family: var(--font-mono); font-size: 0.92em; letter-spacing: -0.01em; }
.muted { color: var(--ink-muted); }
.faint { color: var(--ink-faint); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* 图标：lucide 1.33（构建时从 lucide-react 抽成 sprite 内联） */
.i {
  width: 16px; height: 16px; flex: none;
  fill: none; stroke: currentColor; stroke-width: 1.75;
  stroke-linecap: round; stroke-linejoin: round;
}
.i.sm { width: 14px; height: 14px; }
.i.xs { width: 12px; height: 12px; stroke-width: 2; }
.i.lg { width: 18px; height: 18px; }

/* 焦点环：唯一的 2px 蓝紫环 */
:where(button, a, input, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 1px;
}

/* ── Button ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: var(--control-h); padding: 0 12px;
  border-radius: var(--radius-field);
  font-size: var(--text-ui); font-weight: 500; white-space: nowrap;
  transition: background var(--dur-fast), border-color var(--dur-fast), color var(--dur-fast);
}
.btn-primary { background: var(--accent); color: var(--accent-fg); }
.btn-primary:hover { background: var(--accent-strong); }
.btn-outline { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); }
.btn-outline:hover { background: var(--surface-hover); }
.btn-ghost { color: var(--ink-muted); }
.btn-ghost:hover { background: var(--surface-hover); color: var(--ink); }
.btn-danger-outline { border: 1px solid var(--danger-line); color: var(--danger-ink); background: transparent; }
.btn-danger-outline:hover { background: var(--danger-muted); }
.btn-sm { height: var(--control-h-sm); padding: 0 8px; font-size: var(--text-label); }
.btn[disabled] { opacity: 0.45; pointer-events: none; }
.icon-btn {
  display: inline-grid; place-items: center;
  width: var(--control-h); height: var(--control-h);
  border-radius: var(--radius-field); color: var(--ink-muted);
  transition: background var(--dur-fast), color var(--dur-fast);
}
.icon-btn:hover, .icon-btn[aria-expanded="true"] { background: var(--surface-hover); color: var(--ink); }
.icon-btn.sm { width: 26px; height: 26px; }

/* ── Input ── */
.input {
  display: flex; align-items: center; gap: 8px;
  height: var(--control-h); padding: 0 10px;
  border: 1px solid var(--line-strong); border-radius: var(--radius-field);
  background: var(--surface); color: var(--ink-faint);
}
.input input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: var(--text-ui); }
.input input::placeholder { color: var(--ink-faint); }
.input:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 2px var(--focus-ring); }

/* ── Kbd ── */
.kbd {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 4px;
  border: 1px solid var(--line); border-radius: 4px;
  font-family: var(--font-mono); font-size: var(--text-nano); color: var(--ink-faint);
  background: var(--surface);
}

/* ── Dot（状态色唯一的出场方式之一） ── */
.dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--ink-faint); }
.dot.positive { background: var(--positive); }
.dot.warn { background: var(--warn); }
.dot.danger { background: var(--danger); }
.dot.unread { background: var(--unread); }
.dot.fork { background: var(--fork); }
.dot.project { background: var(--mode-project); }
.dot.chat { background: var(--mode-chat); }
.dot.idle { background: transparent; box-shadow: inset 0 0 0 1px var(--ink-faint); }
.dot.live { background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }

/* ── Badge（中性底 + 可选状态点；不做彩色实心 badge） ── */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  height: 20px; padding: 0 7px;
  border: 1px solid var(--line); border-radius: 5px;
  font-size: var(--text-label); color: var(--ink-muted); white-space: nowrap;
}
.badge.positive { border-color: var(--positive-line); }
.badge.danger { border-color: var(--danger-line); }
.badge.warn { border-color: var(--warn-line); }

/* ── Segmented（Tabs 原语） ── */
.seg {
  display: inline-flex; padding: 2px; gap: 2px;
  background: var(--surface-muted); border-radius: var(--radius-field);
}
.seg button {
  height: 26px; padding: 0 10px; border-radius: 4px;
  font-size: var(--text-ui); color: var(--ink-muted);
  display: inline-flex; align-items: center; gap: 6px;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-selected="true"] {
  background: var(--surface); color: var(--ink);
  box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,0.04);
}

/* ── Popover / Menu（浮层：唯一允许阴影的地方） ── */
.pop {
  position: absolute; z-index: var(--z-popover);
  background: var(--surface-raised); border-radius: var(--radius-overlay);
  box-shadow: var(--shadow-overlay); padding: 4px;
  opacity: 0; transform: scale(0.97); pointer-events: none;
  transform-origin: top center;
  transition: opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.pop.open { opacity: 1; transform: none; pointer-events: auto; }
.menu-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  height: 32px; padding: 0 8px; border-radius: 6px;
  font-size: var(--text-ui); color: var(--ink); text-align: left;
}
.menu-item .i { color: var(--ink-muted); }
.menu-item:hover, .menu-item.active { background: var(--surface-hover); }
.menu-item .end { margin-left: auto; color: var(--ink-faint); font-size: var(--text-label); display: inline-flex; gap: 4px; align-items: center; }
.menu-sep { height: 1px; background: var(--line); margin: 4px -4px; }
.menu-label { padding: 6px 8px 4px; font-size: var(--text-label); color: var(--ink-faint); }

/* ── Tooltip（hover 触发，纯 CSS） ── */
[data-tip] { position: relative; }
[data-tip]::after {
  content: attr(data-tip);
  position: absolute; left: 50%; top: calc(100% + 6px); transform: translate(-50%, -2px);
  padding: 4px 8px; border-radius: 6px; white-space: nowrap;
  background: var(--ink-strong); color: var(--surface-canvas);
  font-size: var(--text-label); font-weight: 400; line-height: 1.4;
  opacity: 0; pointer-events: none; z-index: var(--z-modal);
  transition: opacity var(--dur-fast), transform var(--dur-fast);
}
[data-tip]:hover::after { opacity: 1; transform: translate(-50%, 0); transition-delay: 350ms; }
[data-tip-pos="top"]::after { top: auto; bottom: calc(100% + 6px); }

/* ── Skeleton ── */
.sk {
  background: linear-gradient(90deg, var(--surface-muted) 0%, var(--surface-hover) 50%, var(--surface-muted) 100%);
  background-size: 200% 100%; border-radius: 4px;
  animation: sk 1.4s linear infinite;
}
@keyframes sk { to { background-position: -200% 0; } }

/* ── Spinner ── */
.spin { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* 滚动条 */
* { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const root = document.documentElement;
function syncTheme() {
  const d = root.classList.contains("dark");
  $("#themeIcon").setAttribute("href", d ? "#i-moon" : "#i-sun");
  $$("[data-theme-label]").forEach(x => x.textContent = d ? "深色" : "浅色");
}
function toggleTheme() { root.classList.toggle("dark"); localStorage.setItem("trellis-mock-theme", root.classList.contains("dark") ? "dark" : "light"); syncTheme(); }
$("#themeBtn").onclick = toggleTheme;

const tpl = $("#app");
$$(".phone").forEach(ph => {
  ph.appendChild(tpl.content.cloneNode(true));
  const sc = ph.querySelector(".screen");
  if (ph.dataset.init) sc.dataset.open = ph.dataset.init;
  if (ph.dataset.init) sc.querySelector(".mscroll").scrollTop = 0;
  sc.addEventListener("click", (e) => {
    const o = e.target.closest("[data-open-to]"); if (o) { sc.dataset.open = o.dataset.openTo; return; }
    if (e.target.closest("[data-close]")) { delete sc.dataset.open; return; }
    const t = e.target.closest("[data-mt]"); if (t) { const tr = t.closest(".m-trace"); tr.dataset.open = tr.dataset.open === "true" ? "false" : "true"; }
    if (e.target.closest("[data-theme-row]")) toggleTheme();
  });
});
syncTheme();
/* 主对话屏滚到底，看审批卡 */
requestAnimationFrame(() => $$(".phone .mscroll").forEach(s => s.scrollTop = s.scrollHeight));
</script>
</body>
</html>
