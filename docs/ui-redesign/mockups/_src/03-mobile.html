<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trellis 重设计稿 · 03 手机端</title>
<script>
  (function () {
    var q = new URLSearchParams(location.search).get("theme");
    var t = q || localStorage.getItem("trellis-mock-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    if (t === "dark") document.documentElement.classList.add("dark");
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/*@TOKENS*/
/*@BASE*/

/* ── 展示页外壳（非产品 UI） ── */
body { background: var(--surface-muted); }
.stagehead { display: flex; align-items: center; gap: 12px; max-width: 1290px; margin: 0 auto; padding: 24px 24px 0; }
.stagehead h1 { margin: 0; font-size: 15px; font-weight: 600; color: var(--ink-strong); }
.stagehead p { margin: 0; color: var(--ink-faint); font-size: var(--text-ui); }
.stagehead .icon-btn { margin-left: auto; }
.phones { display: flex; gap: 32px; justify-content: center; padding: 20px 24px 48px; flex-wrap: wrap; }
.ph-wrap { display: flex; flex-direction: column; gap: 10px; }
.ph-cap { font-size: var(--text-ui); color: var(--ink-muted); display: flex; gap: 8px; align-items: center; }
.ph-cap b { font-weight: 500; color: var(--ink); }
.phone { position: relative; width: 390px; height: 844px; border-radius: 36px; overflow: hidden; background: var(--surface); box-shadow: 0 0 0 1px var(--line-strong), 0 0 0 8px var(--surface), 0 0 0 9px var(--line); }
@media (max-width: 500px) {
  body { background: var(--surface); }
  .stagehead, .ph-cap { display: none; }
  .phones { padding: 0; gap: 0; }
  .phone { border-radius: 0; box-shadow: none; }
}

/* ── 手机 App ── */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; font-size: 14px; }
.status { height: 47px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 28px 0 32px; font-size: 15px; font-weight: 600; color: var(--ink-strong); font-family: var(--font-sans); }
.status .sys { display: flex; gap: 6px; align-items: center; }
.status .sys .i { width: 17px; height: 17px; }
.mhd { height: 48px; flex: none; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 0 4px; border-bottom: 1px solid var(--line); }
.hit { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 10px; color: var(--ink-muted); }
.hit:active { background: var(--surface-hover); }
.mhd .title { text-align: center; min-width: 0; }
.mhd .title b { display: block; font-size: 15px; font-weight: 600; color: var(--ink-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mhd .title span { display: inline-flex; gap: 5px; align-items: center; font-size: 11.5px; color: var(--ink-faint); }
.mscroll { flex: 1; overflow-y: auto; padding: 4px 16px 16px; }
.m-user { background: var(--surface-muted); border-radius: 10px; padding: 10px 12px; font-size: 15px; line-height: 1.6; color: var(--ink-strong); margin-top: 18px; }
.m-asst { font-size: 15px; line-height: 1.7; color: var(--ink); margin-top: 12px; }
.m-asst p { margin: 0 0 10px; }
.m-asst code { font-family: var(--font-mono); font-size: 0.85em; background: var(--code-inline-bg); padding: 1px 4px; border-radius: 4px; }
.m-asst strong { font-weight: 600; color: var(--ink-strong); }
.m-trace { margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; }
.m-trace .hd { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 0 12px; font-size: 13px; color: var(--ink-muted); }
.m-trace .hd b { font-weight: 500; color: var(--ink); }
.m-trace .hd .r { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); }
.m-trace .hd .chev { color: var(--ink-faint); transition: transform var(--dur-fast); }
.m-trace[data-open="true"] .hd .chev { transform: rotate(90deg); }
.m-trace .bd { border-top: 1px solid var(--line); padding: 2px 0; }
.m-trace[data-open="false"] .bd { display: none; }
.m-step { display: grid; grid-template-columns: 16px auto 1fr 14px; gap: 8px; align-items: center; min-height: 40px; padding: 0 12px; font-size: 13px; }
.m-step .i { color: var(--ink-faint); }
.m-step .tool { font-weight: 500; color: var(--ink); }
.m-step .arg { font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.m-code { border: 1px solid var(--line); border-radius: 8px; background: var(--code-bg); margin: 0 0 10px; overflow: hidden; }
.m-code .bar { height: 32px; display: flex; align-items: center; padding: 0 4px 0 10px; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-faint); border-bottom: 1px solid var(--code-bar-line); }
.m-code .bar .hit { margin-left: auto; width: 40px; height: 32px; }
.m-code pre { margin: 0; padding: 8px 10px; font-family: var(--font-mono); font-size: 12px; line-height: 1.65; color: var(--code-ink); overflow-x: auto; }
.m-code .add { background: var(--code-add-bg); display: block; margin: 0 -10px; padding: 0 10px; }
.m-approve { margin: 12px 0 4px; border: 1px solid var(--accent-line); border-radius: 10px; padding: 14px; }
.m-approve .h { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.m-approve .h .i { color: var(--accent); }
.m-approve .h .tool { font-family: var(--font-mono); font-size: 12px; padding: 1px 6px; border: 1px solid var(--line-strong); border-radius: 4px; }
.m-approve pre { margin: 10px 0 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--code-bg); font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; word-break: break-all; }
.m-approve .acts { display: flex; flex-direction: column; gap: 8px; }
.m-approve .btn { height: 44px; font-size: 14px; }
.m-approve .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.m-run { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: var(--ink-muted); }
.m-run .t { font-family: var(--font-mono); font-size: 12px; color: var(--ink-faint); }

.mcomp { flex: none; padding: 6px 10px calc(10px + 20px); border-top: 1px solid var(--line); background: var(--surface); }
.mcomp .to { display: flex; align-items: center; gap: 5px; padding: 2px 4px 6px; font-size: 11.5px; color: var(--ink-faint); }
.mcomp .to b { font-weight: 500; color: var(--ink-muted); }
.mcomp .card { border: 1px solid var(--line-strong); border-radius: 12px; }
.mcomp textarea { display: block; width: 100%; border: 0; outline: 0; resize: none; background: transparent; padding: 10px 12px 2px; font-size: 16px; color: var(--ink); height: 40px; }
.mcomp textarea::placeholder { color: var(--ink-faint); }
.mcomp .bar { display: flex; align-items: center; padding: 0 2px 2px 4px; }
.mcomp .chipbtn { height: 44px; display: inline-flex; align-items: center; padding: 0 4px; }
.mcomp .chipbtn span.c { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; font-size: 13px; color: var(--ink-muted); }
.mcomp .chipbtn .i { color: var(--ink-faint); }
.mcomp .send { margin-left: auto; width: 44px; height: 44px; display: grid; place-items: center; }
.mcomp .send span { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: var(--ink-strong); color: var(--surface); }
.mcomp .send .i { fill: currentColor; }
.homebar { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--ink-strong); opacity: 0.85; z-index: 30; }

/* 遮罩 + 抽屉 + 底部 sheet */
.m-scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 10; opacity: 0; pointer-events: none; transition: opacity var(--dur-base); }
.screen[data-open] .m-scrim { opacity: 1; pointer-events: auto; }
.drawer { position: absolute; top: 0; bottom: 0; left: 0; width: 318px; z-index: 20; background: var(--surface-canvas); border-right: 1px solid var(--line); display: flex; flex-direction: column; transform: translateX(-102%); transition: transform var(--dur-base) var(--ease-out); }
.screen[data-open="drawer"] .drawer { transform: none; }
.drawer .dtop { padding: 0 12px 8px; display: flex; flex-direction: column; gap: 8px; }
.drawer .brand { display: flex; align-items: center; gap: 8px; height: 44px; padding-left: 4px; }
.drawer .brand .hit { margin-left: auto; }
.logo { width: 20px; height: 20px; border-radius: 6px; background: linear-gradient(135deg, #6366f1 0%, #d946ef 55%, #f59e0b 100%); }
.drawer .brand b { font-size: 15px; font-weight: 600; color: var(--ink-strong); }
.drawer .btn { height: 44px; font-size: 14px; }
.drawer .input { height: 44px; font-size: 14px; }
.drawer .seg button { height: 38px; flex: 1; justify-content: center; font-size: 13px; }
.drawer .seg { display: flex; }
.dtree { flex: 1; overflow-y: auto; padding: 4px 8px; }
.dlabel { padding: 12px 10px 4px; font-size: 12px; color: var(--ink-faint); display: flex; align-items: center; gap: 6px; }
.drow { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px 0 calc(10px + var(--lv, 0) * 14px); border-radius: 8px; font-size: 14px; color: var(--ink); position: relative; }
.drow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drow .mt { font-size: 12px; color: var(--ink-faint); display: inline-flex; gap: 4px; align-items: center; }
.drow .slot { width: 14px; display: grid; place-items: center; color: var(--ink-faint); flex: none; }
.drow.sel { background: var(--accent-muted); color: var(--accent-ink); }
.drow.sel::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; border-radius: 2px; background: var(--accent); }
.drow.ws { color: var(--ink-muted); font-size: 13px; }
.drow.ws .i { color: var(--ink-faint); }
.dfoot { border-top: 1px solid var(--line); padding: 6px 8px 30px; display: flex; }
.dfoot a, .dfoot button { flex: 1; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 10px; border-radius: 8px; color: var(--ink-muted); font-size: 14px; }

.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface-raised); border-radius: 16px 16px 0 0; box-shadow: var(--shadow-overlay); transform: translateY(102%); transition: transform var(--dur-base) var(--ease-out); max-height: 86%; display: flex; flex-direction: column; }
.screen[data-open="sheet"] .sheet { transform: none; }
.sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 8px auto 0; }
.sheet .sh { display: flex; align-items: center; padding: 2px 6px 2px 16px; }
.sheet .sh b { font-size: 15px; font-weight: 600; color: var(--ink-strong); }
.sheet .sh .hit { margin-left: auto; }
.sheet .sb { overflow-y: auto; padding: 0 8px 30px; }
.ctx { margin: 4px 8px 8px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; display: grid; gap: 10px; }
.ctx .l { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-muted); }
.ctx .l .v { margin-left: auto; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.ctx .bar { height: 4px; border-radius: 2px; background: var(--surface-muted); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.ctx .bar i { display: block; height: 100%; width: 62%; background: var(--ink-faint); }
.ctx .toks { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-faint); }
.sgrp { padding: 10px 12px 4px; font-size: 12px; color: var(--ink-faint); }
.srow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 0 12px; border-radius: 8px; font-size: 15px; color: var(--ink); text-align: left; }
.srow:active { background: var(--surface-hover); }
.srow .i { color: var(--ink-muted); width: 18px; height: 18px; }
.srow .end { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink-faint); }
.srow .end .i { width: 16px; height: 16px; color: var(--ink-faint); }
</style>
</head>
<body>
<!--@SPRITE-->

<div class="stagehead">
  <h1>手机端 · 390 × 844</h1>
  <p>三屏：主对话 · 侧栏抽屉 · 更多功能。每一屏都可点：左上菜单开抽屉、右上更多开 sheet、点遮罩关闭。热区 ≥ 44px。</p>
  <button class="icon-btn" aria-label="切换主题" data-tip="切换明暗" id="themeBtn"><svg class="i"><use href="#i-sun" id="themeIcon"/></svg></button>
</div>

<div class="phones">
  <div class="ph-wrap"><div class="ph-cap"><b>1</b>主对话（等待审批）</div><div class="phone" data-init=""></div></div>
  <div class="ph-wrap"><div class="ph-cap"><b>2</b>侧栏抽屉</div><div class="phone" data-init="drawer"></div></div>
  <div class="ph-wrap"><div class="ph-cap"><b>3</b>更多功能</div><div class="phone" data-init="sheet"></div></div>
</div>

<template id="app">
  <div class="screen">
    <div class="status"><span>9:41</span><span class="sys"><svg class="i"><use href="#i-signal"/></svg><svg class="i"><use href="#i-wifi"/></svg><svg class="i"><use href="#i-battery-full"/></svg></span></div>
    <header class="mhd" data-mobile-header>
      <button class="hit" aria-label="打开侧栏" data-open-to="drawer" data-mobile-target="open-drawer"><svg class="i lg"><use href="#i-menu"/></svg></button>
      <div class="title"><b>claude design 为啥效果这么好</b><span><span class="dot project"></span>Project · claude-opus-5-5</span></div>
      <button class="hit" aria-label="更多功能" data-open-to="sheet" data-mobile-target="open-overflow"><svg class="i lg"><use href="#i-ellipsis"/></svg></button>
    </header>

    <div class="mscroll">
      <div class="m-user">那把评估闭环补上：给 prototype-evaluation 加上网页视觉的 rubric，别动已经定稿的结构。</div>
      <div class="m-trace" data-open="false"><button class="hd" data-mt><svg class="i xs chev"><use href="#i-chevron-right"/></svg><span><b>7 步</b> · Edit, Read, Bash</span><span class="dot danger"></span><span style="font-size:12px">2 失败</span><span class="r">41.2s</span></button>
        <div class="bd">
          <div class="m-step"><svg class="i sm"><use href="#i-file-text"/></svg><span class="tool">Read</span><span class="arg">prototype-evaluation.md</span><svg class="i xs"><use href="#i-check"/></svg></div>
          <div class="m-step"><svg class="i sm"><use href="#i-square-terminal"/></svg><span class="tool">Bash</span><span class="arg">sed -n '70,90p' …</span><span class="dot danger"></span></div>
          <div class="m-step"><svg class="i sm"><use href="#i-file-pen-line"/></svg><span class="tool">Edit</span><span class="arg">+18 −2</span><svg class="i xs"><use href="#i-check"/></svg></div>
        </div>
      </div>
      <div class="m-asst">
        <p>补好了。三处 Edit 都落在 <code>prototype-evaluation.md</code>，没动已定稿的结构：</p>
        <div class="m-code"><div class="bar">prototype-evaluation.md<button class="hit" aria-label="复制代码"><svg class="i sm"><use href="#i-copy"/></svg></button></div>
<pre><span class="add">+ ### H1–H5（网页视觉，自包含）</span><span class="add">+ - H1 层级：主次操作一眼可分</span><span class="add">+ - H2 克制：同屏饱和色 ≤ 2</span></pre></div>
      </div>

      <div class="m-user">跑一下 web_review.py 验证一遍，过了就 commit。</div>
      <div class="m-trace" data-open="true"><button class="hd" data-mt><svg class="i xs chev"><use href="#i-chevron-right"/></svg><span><b>3 步</b> · Read, Bash</span><span class="r">8.7s</span></button>
        <div class="bd">
          <div class="m-step"><svg class="i sm"><use href="#i-file-text"/></svg><span class="tool">Read</span><span class="arg">web_review.py</span><svg class="i xs"><use href="#i-check"/></svg></div>
          <div class="m-step"><svg class="i sm"><use href="#i-square-terminal"/></svg><span class="tool">Bash</span><span class="arg">uv run python web_review.py</span><svg class="i xs"><use href="#i-check"/></svg></div>
          <div class="m-step"><svg class="i sm"><use href="#i-square-terminal"/></svg><span class="tool">Bash</span><span class="arg">git commit -am "docs…"</span><svg class="i xs" style="color:var(--accent)"><use href="#i-hand"/></svg></div>
        </div>
      </div>
      <div class="m-asst">
        <p>验证通过：H1–H5 全部命中。准备提交——</p>
        <div class="m-approve" data-mobile-interaction>
          <div class="h"><svg class="i"><use href="#i-shield-check"/></svg><b style="font-weight:500">需要你批准</b><span class="tool">Bash</span></div>
          <pre>git commit -am "docs(ui-explorer): 补网页视觉 rubric H1–H5"</pre>
          <div class="acts">
            <button class="btn btn-primary" data-mobile-target="permission-allow">允许一次</button>
            <div class="row2">
              <button class="btn btn-outline" data-mobile-target="permission-deny">拒绝</button>
              <button class="btn btn-ghost" data-mobile-target="permission-always">总是允许</button>
            </div>
          </div>
        </div>
        <div class="m-run"><span class="dot live"></span>等待你批准<span class="t">42s</span></div>
      </div>
    </div>

    <div class="mcomp" data-mobile-composer>
      <div class="to"><svg class="i xs"><use href="#i-git-branch"/></svg>发送到：<b>评估闭环</b><span class="mono">#9</span></div>
      <div class="card">
        <textarea placeholder="继续对话…" rows="1"></textarea>
        <div class="bar">
          <button class="chipbtn" aria-label="模式"><span class="c"><span class="dot project"></span>Project</span></button>
          <button class="chipbtn" aria-label="模型"><span class="c"><svg class="i sm"><use href="#i-cpu"/></svg><span class="mono" style="font-size:12px">opus-5-5</span></span></button>
          <button class="hit" aria-label="添加附件"><svg class="i"><use href="#i-paperclip"/></svg></button>
          <button class="send" aria-label="停止生成"><span><svg class="i sm"><use href="#i-square"/></svg></span></button>
        </div>
      </div>
    </div>

    <div class="m-scrim" data-close></div>

    <!-- 抽屉 -->
    <aside class="drawer" aria-label="会话导航">
      <div style="height:47px;flex:none"></div>
      <div class="dtop">
        <div class="brand"><span class="logo"></span><b>Trellis</b><button class="hit" aria-label="关闭侧栏" data-close><svg class="i lg"><use href="#i-x"/></svg></button></div>
        <button class="btn btn-primary"><svg class="i"><use href="#i-plus"/></svg>新会话</button>
        <label class="input"><svg class="i sm"><use href="#i-search"/></svg><input placeholder="筛选会话"></label>
        <div class="seg"><button aria-selected="true">按项目</button><button aria-selected="false">按时间</button></div>
      </div>
      <div class="dtree">
        <div class="dlabel"><svg class="i sm"><use href="#i-folder-git-2"/></svg>.claude</div>
        <div class="drow ws" style="--lv:0"><svg class="i sm"><use href="#i-git-branch"/></svg><span class="nm">.claude</span><span class="mt mono">main</span></div>
        <div class="drow" style="--lv:1"><span class="slot"><span class="dot unread"></span></span><span class="nm">pvncher 推文</span><span class="mt"><svg class="i xs"><use href="#i-anchor"/></svg></span></div>
        <div class="drow" style="--lv:1"><span class="slot"></span><span class="nm">Hook 拦截问题</span><span class="mt"><svg class="i xs"><use href="#i-anchor"/></svg></span></div>
        <div class="drow" style="--lv:1"><span class="slot"><svg class="i xs"><use href="#i-chevron-down"/></svg></span><span class="nm" style="font-weight:500">harness</span><span class="mt">4 个话题</span></div>
        <div class="drow sel" style="--lv:2"><span class="slot"><svg class="i xs spin"><use href="#i-loader-circle"/></svg></span><span class="nm">claude design 为啥效果这么好</span><span class="mt">9 节</span></div>
        <div class="drow" style="--lv:2"><span class="slot"></span><span class="nm">关于调研文，是不是也需要</span><span class="mt">6/10</span></div>
        <div class="dlabel"><svg class="i sm"><use href="#i-folder-git-2"/></svg>trellis</div>
        <div class="drow ws" style="--lv:0"><svg class="i sm"><use href="#i-git-branch"/></svg><span class="nm">trellis</span><span class="mt mono">main</span></div>
        <div class="drow" style="--lv:1"><span class="slot"><svg class="i xs spin"><use href="#i-loader-circle"/></svg></span><span class="nm">Trellis UI 重设计</span><span class="mt"><svg class="i xs"><use href="#i-anchor"/></svg></span></div>
        <div class="drow" style="--lv:1"><span class="slot"><span class="dot unread"></span></span><span class="nm">仓库日报（定时）</span><span class="mt"><svg class="i xs"><use href="#i-calendar-clock"/></svg>2</span></div>
        <div class="drow" style="--lv:1"><span class="slot"></span><span class="nm">fj-ship-3f07</span><span class="mt">外部</span></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const root = document.documentElement;
function syncTheme() {
  const d = root.classList.contains("dark");
  $("#themeIcon").setAttribute("href", d ? "#i-moon" : "#i-sun");
  $$("[data-theme-label]").forEach(x => x.textContent = d ? "深色" : "浅色");
}
function toggleTheme() { root.classList.toggle("dark"); localStorage.setItem("trellis-mock-theme", root.classList.contains("dark") ? "dark" : "light"); syncTheme(); }
$("#themeBtn").onclick = toggleTheme;

const tpl = $("#app");
$$(".phone").forEach(ph => {
  ph.appendChild(tpl.content.cloneNode(true));
  const sc = ph.querySelector(".screen");
  if (ph.dataset.init) sc.dataset.open = ph.dataset.init;
  if (ph.dataset.init) sc.querySelector(".mscroll").scrollTop = 0;
  sc.addEventListener("click", (e) => {
    const o = e.target.closest("[data-open-to]"); if (o) { sc.dataset.open = o.dataset.openTo; return; }
    if (e.target.closest("[data-close]")) { delete sc.dataset.open; return; }
    const t = e.target.closest("[data-mt]"); if (t) { const tr = t.closest(".m-trace"); tr.dataset.open = tr.dataset.open === "true" ? "false" : "true"; }
    if (e.target.closest("[data-theme-row]")) toggleTheme();
  });
});
syncTheme();
/* 主对话屏滚到底，看审批卡 */
requestAnimationFrame(() => $$(".phone .mscroll").forEach(s => s.scrollTop = s.scrollHeight));
</script>
